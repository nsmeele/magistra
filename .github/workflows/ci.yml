name: CI - Tests and Linting

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

# Runs the same Docker commands as the README, so CI uses the exact Python
# version and packages from the dev image (Dockerfile target `dev`).
jobs:
  lint:
    name: Code Quality Check
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Build dev image
      run: docker compose build app

    - name: Run Black (code formatter check)
      run: docker compose run --rm --no-deps app black --check .
      continue-on-error: true

    - name: Run isort (import sorting check)
      run: docker compose run --rm --no-deps app isort --check-only .
      continue-on-error: true

    - name: Run Flake8 (linting)
      run: docker compose run --rm --no-deps app flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
      continue-on-error: true

  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Build dev image
      run: docker compose build app

    # Tests use in-memory SQLite (tests/conftest.py), so no database service is needed
    - name: Run tests with coverage
      run: docker compose run --rm --no-deps app pytest --cov=app --cov-report=xml --cov-report=term-missing
      continue-on-error: true

    - name: Upload coverage reports
      uses: codecov/codecov-action@v3
      if: success()
      with:
        files: ./coverage.xml
        fail_ci_if_error: false
