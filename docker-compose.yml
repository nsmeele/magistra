# Development environment: everything (Flask, Postgres, Vite) runs in containers.
# The vite service is a one-off tool (npm install / npm run build), not a dev server:
# Flask serves the built assets from static/dist.
services:
  app:
    build:
      context: .
      target: dev
    container_name: magistra_app
    environment:
      DATABASE_URL: postgresql+psycopg://magistra:magistra@db/magistra
      SECRET_KEY: dev-secret-key-change-in-production
      FLASK_RUN_PORT: "5001"
    volumes:
      - .:/app
    ports:
      - "5001:5001"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15-alpine
    container_name: magistra_db
    environment:
      POSTGRES_DB: magistra
      POSTGRES_USER: magistra
      POSTGRES_PASSWORD: magistra
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U magistra"]
      interval: 10s
      timeout: 5s
      retries: 5

  vite:
    image: node:lts-alpine
    container_name: magistra_vite
    working_dir: /app
    command: ["npm", "install"]
    volumes:
      - ./assets:/app/assets
      - ./templates:/app/templates
      - ./static/dist:/app/static/dist
      - ./package.json:/app/package.json
      - ./package-lock.json:/app/package-lock.json
      - ./vite.config.js:/app/vite.config.js
      - node_modules:/app/node_modules
    environment:
      - NODE_ENV=development

volumes:
  postgres_data:
  node_modules:
